<!-- StudentVUE gradebook parser (window.SvueGrades). Pure, no network, no credentials. -->
<script>
/* Grade Lab — StudentVUE gradebook parser.
 * Turns StudentVUE's JSON "Gradebook" responses into the GRADELAB1 v2 payload
 * that importPayload()/applyImport2() already understand, so grade math, dedup
 * (match by period|name) and cloud save are unchanged. NOTE: assignment field
 * names are read defensively (several known spellings) because MCPS's exact
 * fields are not yet verified against a real response. */
(function (root) {
  'use strict';
  function firstDefined(obj, keys) {
    if (!obj) return undefined;
    for (const k of keys) if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
    return undefined;
  }
  function num(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    const s = String(v).trim();
    if (!/^-?\d*\.?\d+$/.test(s)) return null;
    const n = parseFloat(s);
    return isFinite(n) ? n : null;
  }
  function splitPoints(v) {
    if (v == null) return null;
    const m = String(v).match(/^\s*([\d.]+)?\s*\/\s*([\d.]+)\s*$/);
    if (!m) return null;
    return { score: m[1] !== undefined ? num(m[1]) : null, max: num(m[2]) };
  }
  function asArray(v) {
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      const inner = v.Assignment || v.assignment || v.AssignmentGradeCalc || v.assignmentGradeCalc;
      if (inner) return Array.isArray(inner) ? inner : [inner];
    }
    return [];
  }
  function readCategories(mark) {
    const summary = firstDefined(mark, ['gradeCalculationSummary', 'GradeCalculationSummary']);
    const rows = asArray(summary);
    const cats = [];
    for (const r of rows) {
      const name = firstDefined(r, ['type', 'Type', 'name', 'Name']);
      if (name == null) continue;
      const weightRaw = firstDefined(r, ['weight', 'Weight', 'weightedPct', 'WeightedPercentage']);
      const w = num(String(weightRaw).replace('%', '')) || 0;
      if (String(name).trim().toUpperCase() === 'TOTAL') continue;
      cats.push({ name: String(name), weight: w });
    }
    return cats;
  }
  function readAssignment(a) {
    const name = firstDefined(a, ['measure', 'Measure', 'assignmentName', 'name', 'Name', 'title', 'gradeBookId']);
    const type = firstDefined(a, ['type', 'Type', 'category', 'Category', 'measureType', 'MeasureTypeName']);
    const date = firstDefined(a, ['date', 'Date', 'dueDate', 'DueDate', 'dateDue']) || '';
    let score = num(firstDefined(a, ['score', 'Score', 'points', 'Points']));
    let max = num(firstDefined(a, ['pointsPossible', 'PointsPossible', 'maxValue', 'MaxValue', 'pointPossible']));
    if (score === null || max === null) {
      const combined = splitPoints(firstDefined(a, ['points', 'Points', 'pointsEarnedAndPossible']));
      if (combined) {
        if (score === null) score = combined.score;
        if (max === null) max = combined.max;
      }
    }
    return { name: name != null ? String(name) : 'Assignment', date: String(date), type: type != null ? String(type) : '', score, max };
  }
  function isGraded(a) {
    const notForGrading = a && (a.notForGrading === true || a.isForGrading === false || a.hideInPortal === true || a.excused === true);
    return !notForGrading;
  }
  function markToTermData(mark) {
    const cats = readCategories(mark);
    const asg = asArray(firstDefined(mark, ['assignments', 'Assignments'])).filter(isGraded).map(readAssignment);
    const pct = num(firstDefined(mark, ['calculatedScoreRaw', 'CalculatedScoreRaw']));
    return { pct: pct === null ? null : pct, cats, asg };
  }
  function parseGradebook(response) {
    const gb = (response && response.data && response.data.traditionalGradebook) || (response && response.traditionalGradebook) || response;
    if (!gb || !Array.isArray(firstDefined(gb, ['courses', 'Courses']))) {
      throw new Error('That response has no traditional grade book. (standardsGradebook or an empty answer.)');
    }
    const periodName = (() => {
      const rp = firstDefined(gb, ['reportingPeriod', 'ReportingPeriod']);
      return (rp && String(firstDefined(rp, ['gradePeriod', 'GradePeriod']) || '')) || '';
    })();
    const courses = firstDefined(gb, ['courses', 'Courses']) || [];
    const classes = courses.map((c) => {
      const marks = asArray(firstDefined(c, ['marks', 'Marks']));
      const mark = marks[0] || {};
      return {
        period: String(firstDefined(c, ['period', 'Period']) || ''),
        name: String(firstDefined(c, ['title', 'Title', 'courseName', 'CourseName']) || ''),
        teacher: String(firstDefined(c, ['staff', 'Staff', 'teacher', 'Teacher']) || ''),
        room: String(firstDefined(c, ['room', 'Room']) || ''),
        td: markToTermData(mark),
      };
    });
    return { periodName, classes };
  }
  function reportingPeriods(response) {
    const gb = (response && response.data && response.data.traditionalGradebook) || (response && response.traditionalGradebook) || response;
    const rps = (gb && firstDefined(gb, ['reportingPeriods', 'ReportingPeriods'])) || [];
    return asArray(rps).map((r) => ({
      index: String(firstDefined(r, ['index', 'Index']) ?? ''),
      name: String(firstDefined(r, ['gradePeriod', 'GradePeriod']) || ''),
    })).filter((r) => r.name);
  }
  function buildPayload(perPeriod, opts) {
    opts = opts || {};
    const periods = [];
    const classMap = new Map();
    for (const pp of perPeriod) {
      if (pp.periodName && !periods.includes(pp.periodName)) periods.push(pp.periodName);
      for (const c of pp.classes) {
        const key = (c.period || '') + '|' + c.name;
        let obj = classMap.get(key);
        if (!obj) { obj = { period: c.period, name: c.name, teacher: c.teacher, room: c.room, terms: {} }; classMap.set(key, obj); }
        if (pp.periodName) obj.terms[pp.periodName] = c.td;
      }
    }
    return { v: 2, at: opts.at || Date.now(), school: opts.school || '',
      current: opts.current || periods[periods.length - 1] || '', periods, classes: Array.from(classMap.values()) };
  }
  function toImportString(payload) { return 'GRADELAB1:' + JSON.stringify(payload); }
  const api = { parseGradebook, reportingPeriods, buildPayload, toImportString };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SvueGrades = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<!-- StudentVUE connection layer (window.SvueProvider). Modular seam; ships nullProvider only. -->
<script>
/* Grade Lab — StudentVUE connection layer (modular).
 * The UI and import pipeline only ever talk to a "provider" through the
 * interface below; they never know how sign-in happens, which keeps auth
 * swappable. Shipped: only nullProvider, which reports honestly that no
 * authorized direct sign-in method is available yet. The sign-in call itself
 * is the single piece that cannot be built with any method available today,
 * so no working remote provider is included. */
(function (root) {
  'use strict';
  class ProviderError extends Error {
    constructor(message, code) { super(message); this.name = 'ProviderError'; this.code = code || 'provider_error'; }
  }
  const nullProvider = {
    id: 'null',
    label: 'StudentVUE (not available yet)',
    configured: () => false,
    async connect() {
      throw new ProviderError(
        'Direct StudentVUE sign-in is not available yet. Grade Lab is ready for it, but no authorized connection method is in place. Use another sync method for now.',
        'no_provider'
      );
    },
    async listPeriods() { throw new ProviderError('Not connected.', 'no_provider'); },
    async fetchGradebook() { throw new ProviderError('Not connected.', 'no_provider'); },
    async disconnect() { /* nothing stored */ },
  };
  const registry = new Map([[nullProvider.id, nullProvider]]);
  function register(provider) {
    if (!provider || !provider.id) throw new Error('A provider needs an id.');
    for (const m of ['configured', 'connect', 'listPeriods', 'fetchGradebook', 'disconnect']) {
      if (typeof provider[m] !== 'function') throw new Error(`Provider ${provider.id} is missing ${m}().`);
    }
    registry.set(provider.id, provider);
    return provider;
  }
  function active() {
    for (const p of registry.values()) if (p.id !== 'null' && p.configured()) return p;
    return nullProvider;
  }
  async function syncAll({ provider, grades, creds, onStatus, school }) {
    const prov = provider || active();
    const say = onStatus || (() => {});
    say('Signing in to StudentVUE…');
    const session = await prov.connect(creds);
    try {
      say('Reading your grading periods…');
      const periods = await prov.listPeriods(session);
      const parsed = [];
      for (const p of periods) {
        say(`Reading ${p.name}…`);
        const raw = await prov.fetchGradebook(session, p.index);
        parsed.push(grades.parseGradebook(raw));
      }
      const payload = grades.buildPayload(parsed, { school: school || '', at: Date.now() });
      return grades.toImportString(payload);
    } finally {
      try { await prov.disconnect(session); } catch (_) {}
    }
  }
  const api = { ProviderError, nullProvider, register, active, registry, syncAll };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.SvueProvider = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  const p = classPct({mode:d.mode, categories:d.categories||[], assignments:d.assignments||[]}, real);
  return p === null && typeof d.svPct === 'number' && !(d.assignments||[]).length ? d.svPct : p;
}
const viewLabel = c => (c.terms && S.term) ? S.term : 'Quarter';
/* Semester = (first marking period + second marking period) / 2. a = first, b = second. */
function semParts(c, pick){
  const n = termNum(S.term);
  if(c.terms && n){
    const odd = n % 2 === 1, other = odd ? n + 1 : n - 1;
    const otherName = (S.terms||[]).find(x => termNum(x) === other && !isInterim(x)) || ('MP' + other);
    const live = classPct(c, pick), o = termPct(c, otherName), curName = S.term.replace(/\s*(interim|progress)\s*/i, ' ').trim();
    return odd ? {aL:curName, bL:otherName, a:live, b:o, liveA:true} : {aL:otherName, bL:curName, a:o, b:live, liveA:false};
  }
  return {aL:'Quarter 1', bL:'Quarter 2', a:num(c.q1), b:classPct(c, pick), liveA:false, manual:true};
}
function semPct(c, pick){ const s = semParts(c, pick); if(s.a === null) return s.b; if(s.b === null) return s.a; return (s.a + s.b) / 2; }
const fmt = (p, d=1) => p === null ? '—' : p.toFixed(d);
const hasWI = c => c.assignments.some(a => a.hypo || (a.wi !== undefined && a.wi !== null && a.wi !== ''));

}

      : (hasWI(c) ? `With what-ifs: ${fmt(pp,2)}%` : (c.mode==='points' ? 'Total points' : 'Weighted by category'))}${!ui.wi && num(c.svPct)!==null ? `<br>StudentVUE shows ${fmt(num(c.svPct),2)}%${p!==null&&Math.abs(p-num(c.svPct))>=0.1?' (your teacher may drop scores or round differently)':''}`:''}</div></div></div>`;

function catsHTML(c){
  if(c.mode === 'points'){
    let s=0,m=0; c.assignments.forEach(a => { const v=(ui.wi?proj:real)(a), mx=num(a.max); if(v===null||!mx) return; s+=v; m+=mx; });
    return `<div class="small muted num">${+s.toFixed(2)} of ${+m.toFixed(2)} points earned</div>`;
  }
  const st = catStats(c, ui.wi ? proj : real);
  const tw = c.categories.reduce((t,x)=>t+(Number(x.weight)||0),0);
  return `<div class="cats">${st.map(x => { const L = letter(x.pct);
    return `<div class="cat"><span><b>${esc(x.cat.name)}</b> <span class="small muted num">${x.cat.weight}% of grade</span></span>
      <span class="num"><b>${x.pct===null?'—':fmt(x.pct)+'%'}</b> <span class="small muted">${x.n?`${+x.earned.toFixed(2)}/${+x.possible.toFixed(2)}`:'nothing graded'}</span></span>
      <span class="bar"><i class="L-${L||'none'}" style="width:${x.pct===null?0:Math.min(100,x.pct)}%"></i></span></div>`; }).join('')}
    ${Math.abs(tw-100) > 0.01 ? `<div class="small" style="color:var(--gD)">Category weights add up to ${tw}%, not 100%. Edit the class to fix them.</div>`:''}</div>`;
}
function semBody(c){
  const sp = semParts(c, ui.wi ? proj : real), t = num(ui.starget);
  if(sp.a === null) return `<div class="muted small">${sp.manual ? `Type your ${sp.aL} grade above to see your semester grade. Until then, the semester grade is just your ${sp.bL} grade.` : `No ${esc(sp.aL)} grades yet.`}</div>`;
  const sem = semPct(c, ui.wi ? proj : real), L = letter(sem);
  const need = T => 2*T - sp.a;
  const cell = v => v <= 0 ? 'Already locked in' : v > 100 ? `${fmt(v)}% (out of reach)` : fmt(v)+'%';
  const n = t === null ? null : need(t);
  return `<div class="head"><span class="letter L-${L||'none'}">${L||'–'}</span>
      <div><div class="label">Semester grade${sp.b === null ? ' so far' : ''}${ui.wi?' with what-ifs':''}</div><div class="answer num">${fmt(sem,2)}%</div>
      <div class="small muted num">${sp.b === null ? `Only ${esc(sp.aL)} so far` : `(${fmt(sp.a,2)} + ${fmt(sp.b,2)}) ÷ 2`}</div></div></div>

}
function semHTML(c){

function subLine(c,a){ const catName=(c.categories.find(x=>x.id===a.cat)||{}).name||''; const w=c.mode==='weighted';

function viewEdit(c){
  const tw = c.categories.reduce((t,x)=>t+(Number(x.weight)||0),0);

/* partial refresh so typing a score doesn't lose focus */
function refresh(){
  const c = cur(); if(!c) return;
  const s = document.getElementById('summary'); if(s) s.innerHTML = summaryHTML(c);
  const k = document.getElementById('cats'); if(k) k.innerHTML = catsHTML(c);
  const sb = document.getElementById('sbody');
  if(sb){ sb.innerHTML = semBody(c); const sp = semParts(c, ui.wi ? proj : real);
    [['sa', sp.a], ['sb', sp.b]].forEach(([id, v]) => { const el = document.getElementById(id); if(el && el.disabled) el.value = v===null ? '' : fmt(v,2); }); }

  const out = [];
  lines.forEach((l, i) => {
    const m = l.match(/^(.+?)\s{2,}Room:\s*(.*)$/); if(!m) return;
    let pct = null;
    for(let k = i + 1; k < Math.min(lines.length, i + 5); k++){ if(/^N\/A$/i.test(lines[k])) break; const p = lines[k].match(/^([\d.]+)%$/); if(p){ pct = +p[1]; break; } }
    out.push({teacher:m[1].trim(), room:m[2].trim(), pct});
  });
  return {kind:'list', classes:out};
}
function parseSVText(text){
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '').replace(/^\s+/, '')).filter(Boolean);
  if(lines.some(l => /^\(S\d\)\s.*\sSEC:\S+/.test(l))) return parseClassPage(lines);
  if(lines.some(l => /\s{2,}Room:/.test(l)) && lines.some(l => /^Total Assignments:/i.test(l))) return parseListPage(lines);
  return null;
}
function flushTerm(){ if(S.term) S.classes.forEach(c => { if(c.terms && c.terms[S.term]) Object.assign(c.terms[S.term], {mode:c.mode, categories:c.categories, assignments:c.assignments}); }); }
function addPeriod(p){ S.terms = [...new Set([...(S.terms || []), p])].sort((a,b) => periodRank(a) - periodRank(b)); }
function importText(text, period){
  const r = parseSVText(text);
  if(!r) throw new Error("That doesn't look like a StudentVUE page. Open the Grade Book (or one class in it), press Ctrl+A, then Ctrl+C, then paste here.");
  flushTerm();
  if(S.sample){ S.classes = []; S.sample = false; }
  addPeriod(period);
  const blank = () => ({mode:'points', categories:[{id:uid(), name:'All work', weight:100}], assignments:[], svPct:null});
  let msg;
  if(r.kind === 'list'){
    if(!r.classes.length) throw new Error('No classes found in what you pasted. Make sure the Grade Book list is showing, then press Ctrl+A, Ctrl+C and paste again.');
    let added = 0;
    r.classes.forEach(x => {
      let c = S.classes.find(k => k.teacher === x.teacher && (!x.room || !k.room || k.room === x.room)) || S.classes.find(k => k.teacher === x.teacher);
      if(!c){ c = {id:uid(), svKey:null, placeholder:true, name:`${x.teacher.split(' ').slice(-1)[0]}'s class`, teacher:x.teacher, staff:x.teacher, period:'', room:x.room,
        level:'regular', credits:1, terms:{}, mode:'points', categories:[], assignments:[]}; S.classes.push(c); added++; }
      if(!c.terms) c.terms = {};
      if(!c.terms[period]) c.terms[period] = blank();
      c.terms[period].svPct = x.pct;
    });
    msg = `Updated ${period} grades for ${r.classes.length} classes.` + (added ? ` To name the new classes and get their assignments, click each class in StudentVUE and paste that page too.` : '');
  } else {
    const key = (r.period || '') + '|' + r.name;
    let c = S.classes.find(k => k.svKey === key) || S.classes.find(k => k.name === r.name) || S.classes.find(k => k.placeholder && k.teacher === r.teacher);
    if(!c && r.teacher){ const same = S.classes.filter(k => k.teacher === r.teacher); if(same.length === 1) c = same[0]; }
    if(!c){ c = {id:uid(), level:guessLevel(r.name), credits:1, terms:{}, mode:'points', categories:[], assignments:[]}; S.classes.push(c); }
    Object.assign(c, {svKey:key, name:r.name, teacher:r.teacher || c.teacher || '', staff:r.teacher || c.staff || '', period:r.period || c.period || ''});
    if(c.placeholder){ delete c.placeholder; c.level = guessLevel(r.name); }
    if(!c.terms) c.terms = {};
    // category weights: reuse ones Grade Lab already knows for this class, else MCPS's standard weights
    const known = {}; Object.values(c.terms).forEach(t => (t.categories || []).forEach(k => { if(+k.weight > 0 && t.mode === 'weighted') known[k.name.toLowerCase()] = +k.weight; }));
    const names = [...new Set(r.asg.map(a => a.type))];
    const cats = names.map(n => ({name:n, weight:known[n.toLowerCase()] ?? MCPS_W[n.toLowerCase()] ?? 0}));
    c.terms[period] = buildTerm({pct:r.pct, cats, asg:r.asg});
    const got = r.asg.filter(a => a.score !== null).length;
    msg = `${r.name}: ${r.asg.length} assignments for ${period}` + (got < r.asg.length ? ` (${r.asg.length - got} not graded yet)` : '') + '.';
    ui.sv.lastClass = c.id;
  }
  S.classes.sort((a,b) => (parseFloat(a.period)||99) - (parseFloat(b.period)||99));
  const t = S.term && S.terms.includes(S.term) ? S.term : period; S.term = null; setTerm(t);
  S.svLast = Date.now(); save();
  return msg;
}
/* ---------- Direct "Connect StudentVUE" (modular provider seam) ----------
   Grade Lab talks only to a provider through window.SvueProvider. The shipped
   default is nullProvider, which reports honestly that no authorized direct
   sign-in method is available yet, so the Connect card shows that state and the
   copy/paste, bookmark and shortcut methods stay the way in. A mock provider is
   registered ONLY when the URL has ?svtest=1, purely to exercise the pipeline
   end to end, and it is always labelled a demo — never shown as a real
   StudentVUE connection. Nothing here stores a password: syncAll() signs in,
   reads, and drops the session in memory. */
const SV_TEST = /[?&]svtest=1(&|$)/.test(location.search);
function svProv(){ return (window.SvueProvider && window.SvueProvider.active) ? window.SvueProvider.active() : null; }
function svConfigured(){ const p = svProv(); return !!(p && p.configured && p.configured()); }

  // DEMO / TEST ONLY (see note above). Returns sample grades; keeps no password.
  const mockGB = period => ({ data:{ traditionalGradebook:{
    reportingPeriods:[{index:'0',gradePeriod:'MP1'},{index:'1',gradePeriod:'MP2'}],
    reportingPeriod:{ gradePeriod:period },
    courses:[
      { period:'1', title:'AP Calculus AB', staff:'Ms. Lee', room:'210', marks:[{ markName:period, calculatedScoreRaw: period==='MP1'?'93.4':'91',
        gradeCalculationSummary:[{type:'All Tasks / Assessments',weight:'90%'},{type:'Practice / Preparation',weight:'10%'}],
        assignments:[{measure:period==='MP1'?'Unit 1 Test':'Unit 3 Test',type:'All Tasks / Assessments',date:'09/12/2026',score:'46',pointsPossible:'50'},
                     {measure:'HW 1.1',type:'Practice / Preparation',date:'09/05/2026',points:'10 / 10'}]}]},
      { period:'2', title:'English 10', staff:'Mr. Diaz', room:'114', marks:[{ markName:period, calculatedScoreRaw:'88',
        gradeCalculationSummary:[], assignments:[{measure:'Essay 1',type:'Writing',date:'09/18/2026',points:'42 / 50'}]}]},
    ]}}});
  try{ window.SvueProvider.register({
    id:'demo-mock', label:'Demo (mock StudentVUE)', configured:()=>true,
    async connect({ studentId, password }){ await new Promise(r=>setTimeout(r,250));
      if(!studentId || !password) throw new window.SvueProvider.ProviderError('Enter an ID and a password.', 'bad_input');
      if(password==='wrong') throw new window.SvueProvider.ProviderError('StudentVUE said: Invalid user id or password.', 'bad_login');
      return { studentId }; },
    async listPeriods(){ return [{index:'0',name:'MP1'},{index:'1',name:'MP2'}]; },
    async fetchGradebook(_s, i){ await new Promise(r=>setTimeout(r,200)); return mockGB(i==='0'?'MP1':'MP2'); },
    async disconnect(){},
  }); }catch(e){}
}
async function svConnect(){
  const sv = ui.sv, prov = svProv();
  if(!window.SvueProvider || !window.SvueGrades || !prov){ sv.cErr = 'The StudentVUE connection code did not load. Reload the page.'; render(); return; }
  const idEl = document.getElementById('sv-id'), pwEl = document.getElementById('sv-pw');
  const sid = idEl ? idEl.value.trim() : '', pw = pwEl ? pwEl.value : '';
  sv.cBusy = true; sv.cErr = ''; sv.cMsg = ''; render();
  try{
    const str = await window.SvueProvider.syncAll({ provider:prov, grades:window.SvueGrades,
      creds:{ studentId:sid, password:pw }, school:S.svSchool || '',
      onStatus:m => { sv.cMsg = m; const el = document.getElementById('sv-cmsg'); if(el) el.textContent = m; } });
    const n = importPayload(str);   // reuses existing dedup, grade math and cloud save unchanged
    sv.conn = true; sv.cErr = ''; sv.cMsg = `Synced ${n} classes from StudentVUE.`; sv.err = ''; sv.msg = '';
  }catch(err){ sv.conn = false; sv.cMsg = ''; sv.cErr = (err && err.message) || 'Could not connect to StudentVUE.'; }
  finally{ sv.cBusy = false; if(pwEl) pwEl.value = ''; render(); }
}
function svDisconnect(){
  const prov = svProv();
  try{ if(prov && prov.disconnect) Promise.resolve(prov.disconnect()).catch(()=>{}); }catch(e){}
  ui.sv.conn = false; ui.sv.cErr = ''; ui.sv.cMsg = 'Disconnected. Nothing was stored.';
  const pwEl = document.getElementById('sv-pw'); if(pwEl) pwEl.value = '';
  render();
}

    <label class="label" for="sv-id">Student ID</label>

    <div class="row" style="gap:8px">
      <button class="btn primary" data-act="svConnect" ${sv.cBusy?'disabled':''}>${sv.conn?'Refresh grades':'Connect &amp; sync'}</button>
      ${sv.conn?'<button class="btn ghost" data-act="svDisconnect">Disconnect</button>':''}
    </div>
    ${sv.cErr?`<div class="small" style="color:var(--gF)">${esc(sv.cErr)}</div>`:''}
    <div class="small muted" id="sv-cmsg" aria-live="polite">${esc(sv.cMsg||'')}</div>
  </div>`;
}
